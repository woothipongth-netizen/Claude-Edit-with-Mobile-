<!doctype html>
<html lang="th" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      @font-face { font-family: "Brand"; font-weight: 500; src: url("fonts/brand-thai-500-normal.woff2"); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
      @font-face { font-family: "Brand"; font-weight: 500; src: url("fonts/brand-latin-500-normal.woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: "Brand"; font-weight: 700; src: url("fonts/brand-thai-700-normal.woff2"); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
      @font-face { font-family: "Brand"; font-weight: 700; src: url("fonts/brand-latin-700-normal.woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: "Brand"; font-weight: 800; src: url("fonts/brand-thai-800-normal.woff2"); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
      @font-face { font-family: "Brand"; font-weight: 800; src: url("fonts/brand-latin-800-normal.woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
      :root {
        --gold: {{ACCENT}};
        --ink: #ffffff;
        --shade: rgba(12, 8, 6, 0.62);
        --font: "Brand", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #footage { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #vignette {
        position: absolute; inset: 0;
        background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 26%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.6) 100%);
      }
      /* หัวข้อค้างบนจอตลอดช่วงเนื้อหา (บทเรียนจากการทดสอบ: ห้ามมีไตเติ้ลแค่ตอนเปิด) */
      .title { position: absolute; top: 170px; left: 60px; right: 60px; text-align: center; }
      .title span {
        display: inline-block; color: var(--ink); font-size: 74px; font-weight: 800; line-height: 1.15;
        text-shadow: 0 6px 28px rgba(0,0,0,0.75);
      }
      .title em, .line em, .hook em { font-style: normal; color: var(--gold); }
      .hook { position: absolute; left: 0; right: 0; top: 250px; text-align: center; }
      .hook div {
        color: var(--ink); font-size: 112px; font-weight: 800; line-height: 1.12;
        text-shadow: 0 6px 30px rgba(0,0,0,0.75);
      }
      .line { position: absolute; left: 60px; right: 60px; bottom: 330px; text-align: center; }
      .line span {
        display: inline-block; padding: 22px 40px; border-radius: 28px; background: var(--shade);
        color: var(--ink); font-size: 60px; font-weight: 500; line-height: 1.3;
      }
      #endshade { position: absolute; inset: 0; background: rgba(0,0,0,0.62); }
      .end { position: absolute; left: 0; right: 0; top: 640px; text-align: center; }
      .end div { color: var(--gold); font-size: 140px; font-weight: 800; text-shadow: 0 6px 30px rgba(0,0,0,0.6); }
      .cta { position: absolute; left: 0; right: 0; top: 860px; text-align: center; }
      .cta span {
        display: inline-block; padding: 22px 52px; border-radius: 60px;
        background: var(--gold); color: #1a1208; font-size: 58px; font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1080" data-height="1920">
      <video id="footage" class="clip" src="{{FOOTAGE}}" muted playsinline data-start="0" data-duration="{{TOTAL}}" data-track-index="0"></video>
      <audio id="vo" class="clip" src="{{AUDIO}}" data-start="0" data-duration="{{TOTAL}}" data-track-index="1" data-volume="1"></audio>
      <div id="vignette" class="clip" data-start="0" data-duration="{{TOTAL}}" data-track-index="8"></div>
      <div id="endshade" class="clip" data-start="{{END_START}}" data-duration="{{END_DUR}}" data-track-index="2"></div>
      <div id="brand" class="end clip" data-start="{{END_START}}" data-duration="{{END_DUR}}" data-track-index="9"><div>{{BRAND}}</div></div>
      <div id="cta" class="cta clip" data-start="{{END_START}}" data-duration="{{END_DUR}}" data-track-index="10"><span>{{CTA}}</span></div>
      {{ELEMENTS}}
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const hook = {{HOOK}};
      if (hook) {
        tl.fromTo("#hook", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, hook.start);
        tl.to("#hook", { opacity: 0, duration: 0.3 }, hook.end - 0.3);
      }
      const items = [
        {{ANIM}}
      ];
      for (const [id, start, dur, kind] of items) {
        const fade = kind === "title" ? 0.35 : 0.25;
        tl.fromTo(id, { opacity: 0, y: kind === "title" ? -20 : 24 }, { opacity: 1, y: 0, duration: fade, ease: "power2.out" }, start);
        tl.to(id, { opacity: 0, duration: 0.15 }, start + dur - 0.15);
      }
      const endAt = {{END_START}};
      tl.fromTo("#endshade", { opacity: 0 }, { opacity: 1, duration: 0.6 }, endAt);
      tl.fromTo("#brand", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, endAt + 0.2);
      tl.fromTo("#cta", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, endAt + 0.6);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
